name: 🚀 CI/CD Pipeline & Performance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos necesarios para que el bot comente en el PR
permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: CALIDAD DEL CÓDIGO (Tests & Lint)
  # ------------------------------------------------------------------
  quality-check:
    name: 🧪 Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        # 'npm ci' es más rápido y seguro que 'npm install' para CI
        run: npm ci

      - name: Type Check
        # Asegura que no haya errores de TypeScript ocultos
        run: npx tsc --noEmit

      - name: Run Vitest
        # Ejecuta la suite de pruebas que configuramos
        run: npm run test

  # ------------------------------------------------------------------
  # JOB 2: ANÁLISIS DE BUNDLE (Performance)
  # ------------------------------------------------------------------
  bundle-analysis:
    name: 📦 Bundle Size Report
    runs-on: ubuntu-latest
    needs: quality-check # Solo corremos si el código es válido
    if: github.event_name == 'pull_request' # Solo reportamos en PRs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Esta acción construye tu app DOS veces (rama base vs tu cambio)
      # y comenta la diferencia de tamaño en el PR.
      - name: Compare Bundle Size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: build # Ejecuta 'npm run build'
          pattern: "dist/**/*.{js,css,html,json}"
          exclude: "{**/*.map,**/node_modules/**}"

  # ------------------------------------------------------------------
  # JOB 3: DESPLIEGUE (Solo en Main)
  # ------------------------------------------------------------------
  deploy-production:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality-check # Esperamos que los tests pasen
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod' # Despliegue a producción